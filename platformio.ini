[platformio]
default_envs = wt32-eth01

[env:wt32-eth01]
; Physical first-hardware target: Wireless-Tag WT32-ETH01 v1.4.
; Arduino-ESP32 3.3.8 / ESP-IDF 5.5.4, LAN8720A RMII Ethernet + built-in Wi-Fi.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = wt32-eth01
framework = arduino
; Keep the reviewed OTA-capable 4 MB layout: two ~1.875 MiB app slots
; plus a small filesystem partition.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D FS7B_VERSION=\"0.2.12-integration-cleanup\"
    -D FS7B_BOARD_PROFILE=\"WT32-ETH01-v1.4\"
    -D FS7B_ETH_PHY_ADDR=1
    -D FS7B_ETH_MDC=23
    -D FS7B_ETH_MDIO=18
    -D FS7B_ETH_POWER=16
    -D FS7B_HTTP_PORT=80
    -D FS7B_TCP_PORT=5000

; First flash: UART bootloader via an external 3.3 V TTL adapter.
; GPIO0 must be held low only while entering the ROM bootloader, then released
; for normal boot because WT32 Ethernet uses GPIO0 as the external RMII clock.
