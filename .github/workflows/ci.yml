name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Validate project
        run: python tools/validate_project.py
      - name: Validate WT32 and OTA contracts
        run: python tools/validate_wt32_ota.py
      - name: Run host tests
        run: python -m unittest discover -s tests -v
      - name: Build WT32-ETH01 firmware
        run: pio run -e wt32-eth01
